spring.application.name=account-service

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/banking_account_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

customer.service.url=http://customer-service

# Resilience4j circuit breaker

resilience4j.circuitbreaker.instances.customerService.register-health-indicator=true
resilience4j.circuitbreaker.instances.customerService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.customerService.sliding-window-size=10
resilience4j.circuitbreaker.instances.customerService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.customerService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.customerService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.customerService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.customerService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.customerService.record-exceptions[0]=com.banking.account_service.exception.CustomerServiceException
resilience4j.circuitbreaker.instances.customerService.ignore-exceptions[0]=com.banking.account_service.exception.ResourceNotFoundException


#Resilience4j Retry

resilience4j.retry.instances.customerService.max-attempts=3
resilience4j.retry.instances.customerService.wait-duration=500ms

resilience4j.retry.instances.customerService.retry-exceptions[0]=com.banking.account_service.exception.CustomerServiceException
resilience4j.retry.instances.customerService.ignore-exceptions[0]=com.banking.account_service.exception.ResourceNotFoundException


management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
