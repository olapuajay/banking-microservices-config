spring.application.name=api-gateway

server.port=8080

# JWT
security.jwt.secret=${BANKING_JWT_SECRET}

# ROUTE - Account Service
spring.cloud.gateway.server.webflux.routes[0].id=account-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ACCOUNT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/accounts/**

# ROUTE - Customer Service
spring.cloud.gateway.server.webflux.routes[1].id=customer-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/customers/**

# ROUTE - Auth Service
spring.cloud.gateway.server.webflux.routes[2].id=auth-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/auth/**

# ROUTE - Transfer Service
spring.cloud.gateway.server.webflux.routes[3].id=transfer-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://TRANSFER-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/transfers/**

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.access=read_only
