server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/banking_auth_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=banking
spring.rabbitmq.password=banking123

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

security.jwt.secret=${BANKING_JWT_SECRET}
security.jwt.expiration=3600

management.endpoints.web.exposure.include=health,info,refresh

logging.level.root=INFO
logging.level.com.banking.auth=DEBUG

logging.file.name=logs/auth-service.log
